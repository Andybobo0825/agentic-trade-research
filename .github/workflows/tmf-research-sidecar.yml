name: TMF Research Sidecar

on:
  push:
    paths:
      - "tmf-research-agent/**"
      - "docs/txresearch.md"
      - ".github/workflows/tmf-research-sidecar.yml"
  pull_request:
    paths:
      - "tmf-research-agent/**"
      - "docs/txresearch.md"
      - ".github/workflows/tmf-research-sidecar.yml"

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tmf-research-agent
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install sidecar command
        run: python -m pip install --no-deps .
      - name: Verify read-only boundary
        run: tmf verify-readonly
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q src tests
