[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmf-research-agent"
version = "0.1.0"
description = "Read-only TMF market research sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy==1.16.1", "ruff==0.12.3"]

[project.scripts]
tmf = "tmf_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
